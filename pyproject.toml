[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbguard"
version = "1.0.0"
description = "DBGuard: Intelligent Integrity Assessment of Compressed Database Exports Without Full Database Restoration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "DBGuard Research Team"}
]
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "pytest>=8.0.0",
    "reportlab>=4.0.0",
    "zstandard>=0.22.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dbguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
